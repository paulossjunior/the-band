# Esquema de validação: termo de glossário
#
# Termo do vocabulário do domínio. Dependências declaradas como lista VAZIA são normais aqui — um termo pode não depender de ontologia alguma —, e a lista vazia é diferente do campo omitido.
schema:
  id: glossary
  schema_version: 1
  version: 1.0.0
  status: active
  root_key: glossary
  describes: termo de glossário
  required:
    - term        # nos idiomas exigidos
    - definition  # nos idiomas exigidos
  optional:
    - ontology    # quando o termo pertence a uma
    - see_also
  references:
    - see_also[]
  # As cinco declarações comuns a TODO arquivo de conhecimento (FR-007). A ausência de qualquer uma
  # reprova, e campo presente com valor vazio é VIOLAÇÃO, não ausência.
  common:
    - schema_version
    - version
    - id
    - dependencies
    - provenance
    - status
