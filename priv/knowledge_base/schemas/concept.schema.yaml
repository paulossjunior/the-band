# Esquema de validação: conceito
#
# O que a ontologia afirma existir. Exige classificação ontológica porque sem ela um conceito válido pode fundir objeto, evento e agente — e a validação aprovaria a fusão (FR-076).
schema:
  id: concept
  schema_version: 1
  version: 1.0.0
  status: active
  root_key: concept
  describes: conceito
  required:
    - ontology        # a ontologia DONA. É daqui que vem a propriedade, nunca do texto do id (FR-052)
    - label           # nos idiomas exigidos
    - definition      # nos idiomas exigidos
    - classification  # ufo_category, e opcionalmente o conceito mais geral que este especializa
    - attributes      # nome, tipo e obrigatoriedade de cada um (FR-093)
  optional:
    - relations       # relação, alvo e cardinalidade
    - constraints     # DENTRO do conceito, nunca por identificador de arquivo (FR-083)
    - examples
  references:
    - classification.parent
    - relations[].relation
    - relations[].target
  # As cinco declarações comuns a TODO arquivo de conhecimento (FR-007). A ausência de qualquer uma
  # reprova, e campo presente com valor vazio é VIOLAÇÃO, não ausência.
  common:
    - schema_version   # a versão do esquema que este arquivo segue; igual ao padrão do manifesto
    - version          # a versão do CONTEÚDO — muda quando a afirmação muda
    - id               # identificador estável; minúsculas, dígitos, sublinhado, ponto como separador
    - dependencies     # lista declarada; lista VAZIA é diferente de campo omitido
    - provenance       # de onde vem o que este arquivo afirma
    - status           # proposed | active | deprecated — só active chega ao runtime
