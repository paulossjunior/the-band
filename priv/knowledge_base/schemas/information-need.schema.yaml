# Esquema de validação: necessidade de informação
#
# A pergunta de gestão que justifica uma medida existir. O princípio IV proíbe medida, indicador ou painel sem uma destas declarada.
schema:
  id: information-need
  schema_version: 1
  version: 1.0.0
  status: active
  root_key: information-need
  describes: necessidade de informação
  required:
    - name
    - question             # nos idiomas exigidos
    - stakeholders         # quem precisa da resposta
    - decision_supported   # que decisão ela apoia
    - required_concepts
  optional:
    - required_relations
    - candidate_measurements
  references:
    - required_concepts[]
    - required_relations[]
  # Campos cujo texto é declarado POR IDIOMA. O esquema decide, não o código: `name` é traduzível
  # numa necessidade de informação e é nome canônico numa ontologia.
  translatable:
    - name
    - question
    - decision_supported

  # As cinco declarações comuns a TODO arquivo de conhecimento (FR-007). A ausência de qualquer uma
  # reprova, e campo presente com valor vazio é VIOLAÇÃO, não ausência.
  common:
    - schema_version
    - version
    - id
    - dependencies
    - provenance
    - status
