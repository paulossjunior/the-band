# Definição de conector de exemplo. NENHUM valor de credencial aparece aqui — só o NOME da variável
# de ambiente. Este repositório é público: valor de credencial versionado é incidente.
connector_definition:
  id: example.connector.demo
  schema_version: 1
  version: 1.0.0
  status: proposed
  dependencies: []
  provider: demo
  api: rest
  base_url: https://api.exemplo.invalido/v1
  authentication:
    scheme: bearer
    token_env: DEMO_API_TOKEN
  rate_limit:
    requests: 100
    per: minute
  provenance:
    source_type: example
    reference: conjunto reservado da feature 002
